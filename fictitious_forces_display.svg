<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="gridGradCard" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#05051a;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#0c0d29;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#05051a;stop-opacity:1" />
        </linearGradient>
        <marker id="red-arrow-card" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
        </marker>
        <marker id="purple-arrow-card" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6"/>
        </marker>
    </defs>
    <rect width="100%" height="100%" fill="url(#gridGradCard)"/>
    
    <!-- Concentric Polar Grid -->
    <g stroke="#3498db" stroke-width="1" opacity="0.15">
        <circle cx="300" cy="200" r="60"/>
        <circle cx="300" cy="200" r="120"/>
        <circle cx="300" cy="200" r="180"/>
        <line x1="100" y1="200" x2="500" y2="200"/>
        <line x1="300" y1="0" x2="300" y2="400"/>
        <line x1="158" y1="58" x2="442" y2="342"/>
        <line x1="158" y1="342" x2="442" y2="58"/>
    </g>

    <!-- Trajectory curve -->
    <path d="M 150,290 C 180,180 320,110 450,150" fill="none" stroke="#66fcf1" stroke-width="3" opacity="0.8"/>
    
    <!-- Trajectory Point 1 -->
    <circle cx="185" cy="210" r="4" fill="#66fcf1"/>
    <line x1="185" y1="210" x2="150" y2="213" stroke="#e74c3c" stroke-width="2" marker-end="url(#red-arrow-card)"/>
    <line x1="185" y1="210" x2="182" y2="175" stroke="#9b59b6" stroke-width="2" marker-end="url(#purple-arrow-card)"/>
    <text x="140" y="225" font-family="Georgia, serif" font-size="11" fill="#e74c3c">ê_r</text>
    <text x="186" y="168" font-family="Georgia, serif" font-size="11" fill="#9b59b6">ê_θ</text>

    <!-- Trajectory Point 2 -->
    <circle cx="300" cy="140" r="4" fill="#66fcf1"/>
    <line x1="300" y1="140" x2="300" y2="105" stroke="#e74c3c" stroke-width="2" marker-end="url(#red-arrow-card)"/>
    <line x1="300" y1="140" x2="265" y2="140" stroke="#9b59b6" stroke-width="2" marker-end="url(#purple-arrow-card)"/>
    <text x="305" y="100" font-family="Georgia, serif" font-size="11" fill="#e74c3c">ê_r</text>
    <text x="250" y="136" font-family="Georgia, serif" font-size="11" fill="#9b59b6">ê_θ</text>

    <!-- Trajectory Point 3 -->
    <circle cx="415" cy="180" r="4" fill="#66fcf1"/>
    <line x1="415" y1="180" x2="450" y2="174" stroke="#e74c3c" stroke-width="2" marker-end="url(#red-arrow-card)"/>
    <line x1="415" y1="180" x2="409" y2="145" stroke="#9b59b6" stroke-width="2" marker-end="url(#purple-arrow-card)"/>
    <text x="456" y="172" font-family="Georgia, serif" font-size="11" fill="#e74c3c">ê_r</text>
    <text x="403" y="138" font-family="Georgia, serif" font-size="11" fill="#9b59b6">ê_θ</text>

    <!-- Label -->
    <text x="300" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#ffffff" opacity="0.95">x&rsquo;&rsquo;&gamma; + &Gamma;&gamma;_&alpha;&nu; x&rsquo;&alpha; x&rsquo;&nu; = 0</text>
</svg>
